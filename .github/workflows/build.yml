name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build za iPhone (nepotpisano)
        run: |
          set -o pipefail
          xcodebuild -project ESLLink.xcodeproj -scheme ESLLink -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build | tee build-device.log | grep -E "error:|warning: .*\.swift|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/device/Build/Products/Release-iphoneos/ESLLink.app

      - name: Build za simulator
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project ESLLink.xcodeproj -scheme ESLLink -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E -A3 "error:|BUILD (SUCCEEDED|FAILED)"

      - name: Pakovanje
        id: pkg
        run: |
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/device/Build/Products/Release-iphoneos/ESLLink.app/Info.plist)
          N="NetPlanet-Elektronske-Cene-$VER-b${GITHUB_RUN_NUMBER}"
          mkdir -p out/Payload
          cp -R build/device/Build/Products/Release-iphoneos/ESLLink.app out/Payload/
          (cd out && zip -qry "../$N-iPhone-unsigned.ipa" Payload)
          if [ -d build/sim/Build/Products/Debug-iphonesimulator/ESLLink.app ]; then (cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/$N-iOS-simulator.zip" ESLLink.app); fi
          echo "name=$N" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          ls -la *.ipa *.zip || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.pkg.outputs.name || 'build-log' }}
          path: |
            *.ipa
            *-simulator.zip
            build-device.log

      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.pkg.outputs.ver }}-b${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" *.ipa $(ls *-simulator.zip 2>/dev/null) --title "NetPlanet Elektronske cene ${{ steps.pkg.outputs.ver }} (build ${GITHUB_RUN_NUMBER})" \
            --notes "iPhone: preuzmi .ipa i instaliraj preko Sideloadly-ja (vidi docs/iPhone-install.md)."
