name: ESLLink
options:
  bundleIdPrefix: rs.netplanet
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configs/App.xcconfig
  Release: Configs/App.xcconfig
targets:
  ESLLink:
    type: application
    platform: iOS
    sources:
      - path: ESLLink
    settings:
      base:
        PRODUCT_NAME: ESLLink
        INFOPLIST_FILE: ESLLink/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
schemes:
  ESLLink:
    build:
      targets:
        ESLLink: all
    run:
      config: Debug
    archive:
      config: Release
